<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureAccess - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <div class="cube cube-one">
    <span class="face front"></span>
    <span class="face top"></span>
    <span class="face side"></span>
</div>

<div class="cube cube-two">
    <span class="face front"></span>
    <span class="face top"></span>
    <span class="face side"></span>
</div>

<div class="cube cube-three">
    <span class="face front"></span>
    <span class="face top"></span>
    <span class="face side"></span>
</div>

<div class="cube cube-four">
    <span class="face front"></span>
    <span class="face top"></span>
    <span class="face side"></span>
</div>

    <div class="container">

    <div class="welcome-section">

    <img
        src="loginpage.jpeg"
        alt="Woman working on laptop"
        class="welcome-illustration"
    >

    <div class="welcome-content">
        <span>WELCOME TO SECUREACCESS</span>

        <h1>CREATE YOUR FUTURE</h1>

        <p>
            A secure and simple way to manage
            your account.
        </p>
    </div>

</div>>

    <div class="form-section">

        <div id="loginPage">
            <h2>Welcome Back</h2>
            <p>Login to your account</p>

            <form id="loginForm">
                <label>Email</label>
                <input type="email" id="loginEmail"
                       placeholder="Enter your email" required>

                <label>Password</label>
                <input type="password" id="loginPassword"
                       placeholder="Enter your password" required>

                <button type="submit">Login</button>
            </form>

            <p id="loginMessage"></p>

            <p class="switch-text">
                Don't have an account?
                <a href="#" id="showRegister">Register</a>
            </p>
        </div>

        <div id="registerPage" style="display:none;">
            <h2>Join Us</h2>
            <p>Create Your Account, It's Free.</p>

            <form id="registerForm">
                <label>Name</label>
                <input type="text" id="registerName"
                       placeholder="Enter your name" required>

                <label>Email</label>
                <input type="email" id="registerEmail"
                       placeholder="Enter your email" required>

                <label>Password</label>
                <input type="password" id="registerPassword"
                       placeholder="Create password" required>

                <button type="submit">Create Account</button>
            </form>

            <p id="registerMessage"></p>

            <p class="switch-text">
                Already have an account?
                <a href="#" id="showLogin">Login</a>
            </p>
        </div>

    </div>
</div>

    <script src="script.js"></script>

</body>
</html>
